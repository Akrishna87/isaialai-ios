<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Isaialai</title>
  <meta name="description" content="Isaialai (இசையலை): a music player for your own songs.">
  <meta name="theme-color" content="#0E0B14">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Isaialai">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button class="icon-btn back" id="backBtn" aria-label="Back" hidden>
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <h1 id="title">Library</h1>
      <div class="top-actions">
        <button class="icon-btn" id="importBtn" aria-label="Add songs">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
    </header>
    <main id="view" tabindex="-1"></main>

    <div id="mini" class="mini" hidden>
      <div class="mini-progress"><div id="miniBar"></div></div>
      <button class="mini-main" id="miniOpen" aria-label="Open player">
        <img id="miniArt" class="art" alt="">
        <span class="mini-text"><span id="miniTitle" class="t1"></span><span id="miniSub" class="t2"></span></span>
      </button>
      <button class="icon-btn" id="miniPlay" aria-label="Play"></button>
      <button class="icon-btn" id="miniNext" aria-label="Next song">
        <svg viewBox="0 0 24 24" class="fill"><path d="M6 5l9 7-9 7zM16 5h2.5v14H16z"/></svg>
      </button>
    </div>

    <nav class="tabs" id="tabs">
      <button data-tab="library" class="on"><svg viewBox="0 0 24 24"><path d="M4 4v16M9 4v16M14 4l5 15.5"/></svg><span>Library</span></button>
      <button data-tab="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><span>Search</span></button>
      <button data-tab="playlists"><svg viewBox="0 0 24 24"><path d="M4 6h11M4 11h11M4 16h7M17 20a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5zM19.5 17.5V6l2.5 1"/></svg><span>Playlists</span></button>
      <button data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg><span>Settings</span></button>
    </nav>
  </div>

  <section id="player" class="player" aria-label="Now playing" hidden>
    <div class="player-bg" id="playerBg"></div>
    <div class="player-inner">
      <div class="player-top">
        <button class="icon-btn" id="playerClose" aria-label="Close player">
          <svg viewBox="0 0 24 24"><path d="M5 9l7 7 7-7"/></svg>
        </button>
        <span class="player-from" id="playerFrom">Now playing</span>
        <button class="icon-btn" id="playerMore" aria-label="More">
          <svg viewBox="0 0 24 24" class="fill"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
        </button>
      </div>
      <div class="big-art-wrap"><img id="bigArt" class="big-art art" alt=""></div>
      <div class="player-meta">
        <div class="player-titles">
          <div id="pTitle" class="p-title"></div>
          <button id="pArtist" class="p-artist linkish"></button>
        </div>
        <button class="icon-btn like" id="pLike" aria-label="Like"></button>
      </div>
      <div class="seek">
        <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="Seek">
        <div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
      </div>
      <div class="controls">
        <button class="icon-btn sm" id="pShuffle" aria-label="Shuffle">
          <svg viewBox="0 0 24 24"><path d="M3 7h3.5c2 0 3 1 4.2 2.8l2.6 4.4C14.5 16 15.5 17 17.5 17H21M3 17h3.5c1.4 0 2.3-.5 3.1-1.4M13.4 8.4c.8-.9 1.7-1.4 3.1-1.4H21M18 4l3 3-3 3M18 14l3 3-3 3"/></svg>
        </button>
        <button class="icon-btn" id="pPrev" aria-label="Previous song">
          <svg viewBox="0 0 24 24" class="fill"><path d="M18 5l-9 7 9 7zM5.5 5H8v14H5.5z"/></svg>
        </button>
        <button class="icon-btn" id="pBack10" aria-label="Back 10 seconds">
          <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.5h4.5"/><text x="12" y="15.5" text-anchor="middle" font-size="7.5" stroke="none" fill="currentColor" font-weight="700">10</text></svg>
        </button>
        <button class="play-btn" id="pPlay" aria-label="Play"></button>
        <button class="icon-btn" id="pFwd10" aria-label="Forward 10 seconds">
          <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.4-5.7M20 4v4.5h-4.5"/><text x="12" y="15.5" text-anchor="middle" font-size="7.5" stroke="none" fill="currentColor" font-weight="700">10</text></svg>
        </button>
        <button class="icon-btn" id="pNext" aria-label="Next song">
          <svg viewBox="0 0 24 24" class="fill"><path d="M6 5l9 7-9 7zM16 5h2.5v14H16z"/></svg>
        </button>
        <button class="icon-btn sm" id="pRepeat" aria-label="Repeat"></button>
      </div>
      <div class="player-bottom">
        <button class="chip" id="pQueue">
          <svg viewBox="0 0 24 24"><path d="M4 6h12M4 11h12M4 16h8M16 15l5 3-5 3z"/></svg> Up next
        </button>
        <span class="airplay-hint">AirPlay: Control Centre</span>
      </div>
    </div>
  </section>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-scrim" data-close></div>
    <div class="sheet-panel" role="dialog" aria-modal="true">
      <div class="sheet-grip"></div>
      <div id="sheetBody"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <div id="install" class="install" hidden></div>

  <input type="file" id="backupInput" class="vh" accept=".json,application/json" tabindex="-1" aria-hidden="true">
  <input type="file" id="fileInput" class="vh" multiple accept="audio/*,.mp3,.m4a,.zip,application/zip" tabindex="-1" aria-hidden="true">
  <audio id="audio" playsinline preload="auto"></audio>

  <script>
    // Ask for the newest service worker on every launch.
    if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistration().then((r) => r && r.update()).catch(() => {});
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
